<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday!</title>
  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Decorative Room Background Elements */
    .room {
      position: relative;
      width: 100%;
      max-width: 800px;
      height: 600px;
      background: #fff0f5;
      border: 12px solid #ffb6c1;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      overflow: hidden;
    }

    .status-text {
      position: absolute;
      top: 25px;
      font-size: 1.3rem;
      font-weight: bold;
      color: #d63384;
      background: rgba(255, 255, 255, 0.85);
      padding: 10px 20px;
      border-radius: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      text-align: center;
      z-index: 10;
    }

    /* Flowers & Balloons Decor */
    .decorations {
      position: absolute;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .balloon {
      position: absolute;
      width: 50px;
      height: 60px;
      background: #ff6b6b;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      animation: float 4s ease-in-out infinite alternate;
    }
    .balloon::after {
      content: "";
      position: absolute;
      bottom: -12px;
      left: 24px;
      width: 2px;
      height: 25px;
      background: #aaa;
    }

    .b1 { top: 40px; left: 40px; background: #ff4757; animation-delay: 0s; }
    .b2 { top: 80px; left: 100px; background: #ffa502; animation-delay: 1s; }
    .b3 { top: 50px; right: 50px; background: #2ed573; animation-delay: 0.5s; }
    .b4 { top: 90px; right: 110px; background: #1e90ff; animation-delay: 1.5s; }

    .flower {
      position: absolute;
      bottom: 120px;
      font-size: 2.5rem;
    }
    .f1 { left: 30px; }
    .f2 { right: 30px; }

    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-15px); }
    }

    /* Table Setup */
    .table {
      width: 85%;
      height: 140px;
      background: #8b5a2b;
      border-radius: 15px 15px 0 0;
      position: relative;
      border-top: 10px solid #a0522d;
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      padding-top: 10px;
    }

    /* Cake Container */
    .cake-container {
      position: relative;
      top: -90px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .candles {
      display: flex;
      gap: 15px;
      margin-bottom: -5px;
      z-index: 2;
    }

    .candle {
      width: 10px;
      height: 35px;
      background: repeating-linear-gradient(45deg, #fff, #fff 5px, #ff4757 5px, #ff4757 10px);
      position: relative;
    }

    .flame {
      width: 12px;
      height: 18px;
      background: #ffa502;
      border-radius: 50% 50% 20% 20%;
      position: absolute;
      top: -18px;
      left: -1px;
      box-shadow: 0 0 10px #ffa502, 0 0 20px #ff6b81;
      animation: flicker 0.6s infinite alternate;
      cursor: pointer;
    }

    @keyframes flicker {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.15); opacity: 1; }
    }

    .flame.out {
      display: none;
    }

    .cake {
      width: 160px;
      height: 90px;
      background: #f8a5c2;
      border-radius: 10px 10px 0 0;
      position: relative;
      box-shadow: inset 0 -15px 0 #f78fb3, inset 0 15px 0 #fced70;
      transition: transform 0.5s ease;
    }

    .cake-cut {
      clip-path: polygon(0 0, 45% 0, 50% 100%, 0% 100%);
      transform: translateX(-10px);
    }

    /* Card Setup */
    .card-container {
      position: relative;
      top: -50px;
      perspective: 1000px;
      cursor: pointer;
    }

    .card {
      width: 130px;
      height: 90px;
      background: #ffffff;
      border: 2px solid #ff6b81;
      border-radius: 8px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #ff4757;
      transition: transform 0.8s;
      transform-style: preserve-3d;
    }

    .card.open {
      transform: rotateY(-180deg);
    }

    .card-front, .card-inside {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      text-align: center;
    }

    .card-inside {
      background: #fff0f5;
      transform: rotateY(180deg);
      font-size: 0.8rem;
      color: #2f3542;
    }
  </style>
</head>
<body>

  <div class="room">
    <div id="status" class="status-text">Step 1: Click the flames to blow out the candles! 🕯️</div>

    <div class="decorations">
      <div class="balloon b1"></div>
      <div class="balloon b2"></div>
      <div class="balloon b3"></div>
      <div class="balloon b4"></div>
      <div class="flower f1">🌸🌻🌸</div>
      <div class="flower f2">🌸🌻🌸</div>
    </div>

    <div class="table">
      <!-- Cake & Candles -->
      <div class="cake-container" onclick="cutCake()">
        <div class="candles">
          <div class="candle"><div class="flame" onclick="blowFlame(event)"></div></div>
          <div class="candle"><div class="flame" onclick="blowFlame(event)"></div></div>
          <div class="candle"><div class="flame" onclick="blowFlame(event)"></div></div>
        </div>
        <div id="cake" class="cake"></div>
      </div>

      <!-- Greeting Card -->
      <div class="card-container" onclick="openCard()">
        <div id="card" class="card">
          <div class="card-front">
            💌<br>Open Me!
          </div>
          <div class="card-inside">
            🎉 <strong>Happy Birthday!</strong> 🎉<br><br>
            Wishing you a wonderful year filled with love, joy, and success! ✨
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let flamesOut = 0;
    const totalFlames = 3;
    let cakeIsCut = false;

    // 1. Blow Out Candle Logic
    function blowFlame(event) {
      event.stopPropagation(); // Prevent trigger cake cut
      if (event.target.classList.contains('out')) return;

      event.target.classList.add('out');
      flamesOut++;

      if (flamesOut === totalFlames) {
        document.getElementById('status').innerText = "Step 2: Now click the cake to cut it! 🎂";
      }
    }

    // 2. Cut Cake & Play Audio
    function cutCake() {
      if (flamesOut < totalFlames) {
        alert("Blow out all the candles first!");
        return;
      }

      if (!cakeIsCut) {
        document.getElementById('cake').classList.add('cake-cut');
        cakeIsCut = true;

        // Trigger Confetti Celebration
        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 }
        });

        // Play Synthesized Birthday Melody
        playBirthdayTune();

        document.getElementById('status').innerText = "Step 3: Click the card on the right to open your wish! 💌";
      }
    }

    // 3. Open Wish Card Logic
    function openCard() {
      if (!cakeIsCut) {
        alert("Cut the cake first!");
        return;
      }
      document.getElementById('card').classList.add('open');
      document.getElementById('status').innerText = "✨ Happy Birthday! Hope all your wishes come true! ✨";
    }

    // Web Audio Synthesizer for "Happy Birthday" Tune
    function playBirthdayTune() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [
        { note: 261.63, dur: 0.3 }, { note: 261.63, dur: 0.3 }, { note: 293.66, dur: 0.6 },
        { note: 261.63, dur: 0.6 }, { note: 349.23, dur: 0.6 }, { note: 329.63, dur: 1.0 },
        { note: 261.63, dur: 0.3 }, { note: 261.63, dur: 0.3 }, { note: 293.66, dur: 0.6 },
        { note: 261.63, dur: 0.6 }, { note: 392.00, dur: 0.6 }, { note: 349.23, dur: 1.0 }
      ];

      let currentTime = audioCtx.currentTime;
      notes.forEach(({ note, dur }) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = note;
        
        gain.gain.setValueAtTime(0.1, currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, currentTime + dur);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(currentTime);
        osc.stop(currentTime + dur);

        currentTime += dur + 0.05;
      });
    }
  </script>
</body>
</html>
